[project]
name = "lecture-util"
version = "0.1.0"
description = "Download HLS lectures, transcribe them locally with Whisper, and create LLM study notes"
readme = "README.md"
authors = [
    { name = "Seawhan Lee", email = "seawhanl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cublas-cu12>=12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
lecture-util = "lecture_util:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
