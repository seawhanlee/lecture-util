name: Build distributions

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'

      - name: Validate package version and release tag
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          lock = tomllib.loads(Path('uv.lock').read_text())
          package = next(p for p in lock['package'] if p['name'] == project['name'])
          if package['version'] != project['version']:
              raise SystemExit('pyproject.toml and uv.lock versions must match')
          if os.environ['BUILD_REF_TYPE'] == 'tag':
              expected = 'v' + project['version']
              if os.environ['BUILD_REF_NAME'] != expected:
                  raise SystemExit(f'Release tag must match package version: {expected}')
          print(f"Building {project['name']} {project['version']}")
          PY

      - name: Build wheel and source distribution
        run: uv build --clear --python 3.12

      - name: Verify wheel CLI entry point
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import configparser
          import zipfile
          from pathlib import Path

          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Expected exactly one wheel')
          with zipfile.ZipFile(wheels[0]) as wheel:
              entry_points = next(n for n in wheel.namelist() if n.endswith('.dist-info/entry_points.txt'))
              config = configparser.ConfigParser()
              config.read_string(wheel.read(entry_points).decode())
              if config['console_scripts']['lecture-util'] != 'lecture_util:main':
                  raise SystemExit('Missing lecture-util CLI entry point')
          print(f'CLI entry point verified: {wheels[0]}')
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lecture-util-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lecture-util-dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --generate-notes --title "$RELEASE_TAG"
